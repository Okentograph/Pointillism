<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pointillism Art</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #111;
      color: #eee;
      font-family: sans-serif;
      text-align: center;
    }
    #controls {
      margin: 0 auto 16px;
      padding: 12px;
      max-width: 800px;
      background: #1c1c1c;
    }
    .hint {
      margin: 8px 0 0;
      color: #999;
      font-size: 12px;
    }
    canvas {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="sketch.js"></script>
</head>
<body>
  <div id="controls">
    <label>
      画像を選択
      <input id="imageInput" type="file" accept="image/*" />
    </label>
    <p class="hint">左右: 彩度　/　上下: 明度　/　Sキー: 保存</p>
  </div>
</body>
</html>
